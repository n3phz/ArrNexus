version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: arrnexus-backend:latest
    container_name: arrnexus-backend
    ports:
      - "8000:8000"
    volumes:
      - arrnexus-data:/data
    environment:
      - DATABASE_URL=sqlite:////data/arrnexus.db
      - APP_NAME=arrnexus
      - ENVIRONMENT=production
      - DEBUG=false
      - SONARR_URL=http://sonarr:8989
      - RADARR_URL=http://radarr:7878
      - QBITTORRENT_URL=http://qbittorrent:8080
      - PROWLARR_URL=http://prowlarr:9696
    restart: unless-stopped
    networks:
      - arrnexus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: arrnexus-frontend:latest
    container_name: arrnexus-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - arrnexus-network

volumes:
  arrnexus-data:
    driver: local

networks:
  arrnexus-network:
    driver: bridge